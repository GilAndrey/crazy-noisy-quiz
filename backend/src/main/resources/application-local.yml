spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/crazy_noisy_quiz}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

logging:
  level:
    com.crazynoisyquiz: DEBUG
