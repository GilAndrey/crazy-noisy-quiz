spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/crazy_noisy_quiz
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

logging:
  level:
    com.crazynoisyquiz: DEBUG
