spring:
  application:
    name: crazy-noisy-quiz-backend

  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/crazy_noisy_quiz
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
